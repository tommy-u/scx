[package]
name = "scx_snake_heatmap"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
description = "Live CPU migration heatmap for scx_snake"

[workspace]

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
libbpf-rs = "=0.26.2"
scx_utils = { path = "../../rust/scx_utils", version = "1.1.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
scx_cargo = { path = "../../rust/scx_cargo", version = "1.1.1" }
