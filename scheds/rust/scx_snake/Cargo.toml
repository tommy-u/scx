[package]
name = "scx_snake"
version = "1.1.1"
edition = "2021"
description = "A minimal sched_ext scheduler for experimenting with userspace-defined policies"
license = "GPL-2.0-only"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }
crossbeam = "0.8"
ctrlc = { version = "3", features = ["termination"] }
libbpf-rs = "=0.26.2"
log = "0.4"
scx_stats = { path = "../../../rust/scx_stats", version = "1.1.1" }
scx_stats_derive = { path = "../../../rust/scx_stats/scx_stats_derive", version = "1.1.1" }
scx_utils = { path = "../../../rust/scx_utils", version = "1.1.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplelog = "0.12"
toml = "1"

[build-dependencies]
scx_cargo = { path = "../../../rust/scx_cargo", version = "1.1.1" }

[lints.clippy]
unwrap_used = "deny"
