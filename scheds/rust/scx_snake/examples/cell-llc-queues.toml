# Split each cell's normal VTIME storage at LLC boundaries while retaining one
# clock per cell. The fixed pool has one descriptor per active cell/LLC pair;
# only pairs that own CPUs are consumers.
# This example assumes CPUs 0-7 are online; multiple LLCs expose its sharding.
fallback = "any_allowed"

[queues]
layout = "cell_llc"
cell0_cpu_weight = 1

[[queues.enqueue]]
target = "cell"

[[queues.enqueue]]
target = "affinity"

[[queues.dispatch]]
source = "cell"

[[queues.dispatch]]
source = "affinity"

[[cell]]
id = 1
cpus = "0-7"
cpu_weight = 1

[[cell]]
id = 2
cpus = "0-7"
cpu_weight = 1

[[rung]]
operation = "pick_idle_core"
scope = "task_cell"

[[rung]]
operation = "pick_idle"
scope = "task_allowed"
