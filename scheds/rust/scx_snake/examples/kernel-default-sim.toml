fallback = "previous_cpu"

# Keep one shared VTIME domain while userspace lowers LLC topology into local
# normal queues and a rotating remote source for each CPU.
[queues]
layout = "llc"
direct_dispatch = true
enqueue = [
  { action = "try_insert", target = "local" },
  { action = "insert", target = "cpu" },
]
dispatch = [
  { action = "peek", source = "cpu" },
  { action = "peek", source = "local" },
  { action = "peek", source = "remote" },
  { action = "consume", operation = "min_vtime", fallback = ["cpu", "local", "remote"] },
]

[[rung]]
operation = "sync_wake_affine"
scope = "task_allowed"

[[rung]]
operation = "claim_idle_core"
scope = "previous_cpu"

[[rung]]
operation = "pick_idle_core"
scope = "previous_llc"

[[rung]]
operation = "pick_idle_core"
scope = "previous_node"

[[rung]]
operation = "pick_idle_core"
scope = "task_allowed"

[[rung]]
operation = "claim_idle"
scope = "previous_cpu"

[[rung]]
operation = "pick_idle"
scope = "previous_llc"

[[rung]]
operation = "pick_idle"
scope = "previous_node"

[[rung]]
operation = "pick_idle"
scope = "task_allowed"
